{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Enregistrer le courrier sortant</h2>
  <p><strong>{{ courrier.reference }}</strong> — {{ courrier.designation }}</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Enregistrer et notifier</button>
  </form>
</div>
{% endblock %}
